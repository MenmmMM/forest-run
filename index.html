<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>森林快跑</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}
#game{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;font-family:system-ui,sans-serif;color:white}
#score{position:absolute;top:18px;left:18px;font-size:22px;font-weight:700;text-shadow:0 2px 4px #000}
#hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:15px;text-shadow:0 2px 4px #000}
#start{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 34px;border:0;border-radius:14px;background:white;color:#222;font-size:20px;font-weight:700}
#over{display:none;pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);padding:25px;border-radius:18px;text-align:center}
#over button{margin-top:12px;padding:10px 25px;border:0;border-radius:10px;font-size:17px}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="ui">
<div id="score">得分：0　🪙 0　❤️❤️❤️</div>
<button id="start">开始游戏</button>
<div id="over">
游戏结束<br>
<b id="final">0</b> 分<br>
<button id="restart">重新开始</button>
</div>
<div id="hint">左右滑动移动 · 上滑跳跃 · 下滑下滑</div>
</div>

<script>
const c=document.getElementById('game');
const ctx=c.getContext('2d');

let W,H,dpr=1;
let running=false,over=false;
let score=0,speed=5,last=0;
let objects=[];
let spawnT=0,coinCount=0,lives=3;
let invuln=0,hitFlash=0,runTime=0;
let slideTimer=0,boostTimer=0,shieldTimer=0;

let player={
 lane:0,
 targetLane:0,
 y:0,
 vy:0,
 jump:false
};

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;
 H=innerHeight;

 c.width=W*dpr;
 c.height=H*dpr;
 c.style.width=W+'px';
 c.style.height=H+'px';

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener('resize',resize);
resize();

function reset(){
 running=true;
 over=false;
 score=0;
 speed=5;
 objects=[];
 spawnT=0;
 coinCount=0;
 lives=3;
 invuln=0;
 hitFlash=0;
 runTime=0;
 slideTimer=0;
 boostTimer=0;
 shieldTimer=0;

 player={
  lane:0,
  targetLane:0,
  y:0,
  vy:0,
  jump:false
 };

 document.getElementById('start').style.display='none';
 document.getElementById('over').style.display='none';
 document.getElementById('score').textContent='得分：0　🪙 0　❤️❤️❤️';
}

function road(){

 const horizon=H*.34;
 const bottom=H*1.08;
 const cx=W/2;

 const topW=Math.min(W*.13,110);
 const botW=Math.min(W*.94,620);

 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#72c9ff');
 sky.addColorStop(1,'#d9f4ff');

 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,horizon);

 let ground=ctx.createLinearGradient(0,horizon,0,H);
 ground.addColorStop(0,'#5b8d48');
 ground.addColorStop(1,'#264d2d');

 ctx.fillStyle=ground;
 ctx.fillRect(0,horizon,W,H);

 ctx.beginPath();
 ctx.moveTo(cx-topW,horizon);
 ctx.lineTo(cx+topW,horizon);
 ctx.lineTo(cx+botW,bottom);
 ctx.lineTo(cx-botW,bottom);
 ctx.closePath();

 ctx.fillStyle='#555';
 ctx.fill();

 ctx.strokeStyle='#ddd';
 ctx.lineWidth=4;

 ctx.beginPath();
 ctx.moveTo(cx-topW,horizon);
 ctx.lineTo(cx-botW,bottom);
 ctx.moveTo(cx+topW,horizon);
 ctx.lineTo(cx+botW,bottom);
 ctx.stroke();

 ctx.strokeStyle='rgba(255,255,255,.65)';
 ctx.lineWidth=3;

 for(let lane=-1;lane<=1;lane+=2){
  ctx.beginPath();
  ctx.moveTo(cx+lane*topW/3,horizon);
  ctx.lineTo(cx+lane*botW/3,bottom);
  ctx.stroke();
 }

 for(let side=-1;side<=1;side+=2){
  for(let i=0;i<7;i++){

   const z=(i/7+.08)%1;
   const y=horizon+Math.pow(z,1.7)*(H-horizon);
   const scale=.25+z*1.3;
   const x=cx+side*(topW+z*(botW-topW))*1.12;

   drawTree(x,y,scale);
  }
 }
}

function drawTree(x,y,s){

 ctx.fillStyle='#5a3b25';
 ctx.fillRect(x-5*s,y-38*s,10*s,38*s);

 ctx.fillStyle='#17652f';

 ctx.beginPath();
 ctx.arc(x,y-50*s,27*s,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(x-18*s,y-34*s,20*s,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(x+18*s,y-34*s,20*s,0,Math.PI*2);
 ctx.fill();
}

function roadPoint(z,lane){

 const horizon=H*.34;
 const cx=W/2;

 const topW=Math.min(W*.13,110);
 const botW=Math.min(W*.94,620);

 const y=horizon+Math.pow(z,1.65)*(H-horizon);
 const half=topW+(botW-topW)*Math.pow(z,1.2);

 return {
  x:cx+lane*half/2.1,
  y:y,
  scale:.28+z*1.25
 };
}

function spawn(){

 const lane=Math.floor(Math.random()*3)-1;
 const r=Math.random();

 let type;

 if(r<.52)type='coin';
 else if(r<.73)type='rock';
 else if(r<.84)type='low';
 else if(r<.94)type='magnet';
 else if(r<.975)type='boost';
 else type='shield';

 objects.push({
  z:.02,
  lane,
  type,
  spin:Math.random()*Math.PI*2
 });

 if(type==='coin'&&Math.random()<.42){

  for(let k=1;k<=3;k++){

   objects.push({
    z:.02-k*.075,
    lane,
    type:'coin',
    spin:Math.random()*Math.PI*2
   });
  }
 }
}

function drawPlayer(){

 const p=roadPoint(.82,player.lane);

 const x=p.x;
 const groundY=p.y;
 const s=1.25;

 const footY=groundY+player.y;
 const bodyY=footY-30*s;

 const bodyScale=slideTimer>0?.72:1;

 ctx.fillStyle='rgba(0,0,0,.24)';

 ctx.beginPath();
 ctx.ellipse(x,groundY+4,24,7,0,0,Math.PI*2);
 ctx.fill();

 if(invuln>0&&Math.floor(invuln*12)%2===0)
  ctx.globalAlpha=.35;

 ctx.fillStyle='#ffcf33';

 ctx.beginPath();
 ctx.arc(x,bodyY-27*s,13*s,0,Math.PI*2);
 ctx.fill();

 ctx.save();

 ctx.translate(x,bodyY);
 ctx.scale(1,bodyScale);
 ctx.translate(-x,-bodyY);

 ctx.fillStyle='#e94b35';
 ctx.fillRect(x-13*s,bodyY-13*s,26*s,30*s);

 const phase=Math.sin(performance.now()/105);

 const legForward=phase*13*s;
 const legBack=-phase*13*s;

 ctx.strokeStyle='#222';
 ctx.lineWidth=6*s;
 ctx.lineCap='round';

 ctx.beginPath();

 ctx.moveTo(x-10*s,bodyY-3*s);
 ctx.lineTo(x-25*s,bodyY-phase*10*s);

 ctx.moveTo(x+10*s,bodyY-3*s);
 ctx.lineTo(x+25*s,bodyY+phase*10*s);

 ctx.moveTo(x-7*s,bodyY+17*s);
 ctx.lineTo(x-17*s+legForward,footY);

 ctx.moveTo(x+7*s,bodyY+17*s);
 ctx.lineTo(x+17*s+legBack,footY);

 ctx.stroke();

 ctx.lineWidth=7*s;

 ctx.beginPath();

 ctx.moveTo(x-19*s+legForward,footY);
 ctx.lineTo(x-8*s+legForward,footY);

 ctx.moveTo(x+8*s+legBack,footY);
 ctx.lineTo(x+19*s+legBack,footY);

 ctx.stroke();

 ctx.globalAlpha=1;

 ctx.restore();
}

function drawObj(o){

 const p=roadPoint(o.z,o.lane);

 o.spin+=.08;

 if(o.type==='coin'){

  const y=p.y-25*p.scale;
  const squash=Math.max(.12,Math.abs(Math.cos(o.spin)));

  ctx.save();

  ctx.translate(p.x,y);
  ctx.scale(squash,1);

  ctx.fillStyle='#ffd83d';

  ctx.beginPath();
  ctx.arc(0,0,13*p.scale,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle='#fff4a0';
  ctx.lineWidth=3*p.scale;
  ctx.stroke();

  ctx.restore();

 }else if(o.type==='rock'){

  ctx.fillStyle='#6b7075';

  ctx.beginPath();
  ctx.arc(p.x,p.y-18*p.scale,20*p.scale,0,Math.PI*2);
  ctx.fill();

 }else if(o.type==='low'){

  const w=42*p.scale;
  const h=23*p.scale;

  ctx.fillStyle='#d96b32';
  ctx.fillRect(p.x-w/2,p.y-h,w,h);

  ctx.fillStyle='#f4d35e';
  ctx.fillRect(p.x-w/2,p.y-h*.62,w,h*.22);

 }else{

  const y=p.y-24*p.scale;

  const emoji=
   o.type==='magnet'?'🧲':
   o.type==='boost'?'⚡':'🛡️';

  ctx.font=(30*p.scale)+'px system-ui';
  ctx.textAlign='center';
  ctx.textBaseline='middle';

  ctx.fillText(emoji,p.x,y);

  ctx.textAlign='start';
  ctx.textBaseline='alphabetic';
 }
}

function update(dt){

 runTime+=dt;

 player.lane+=(player.targetLane-player.lane)*Math.min(1,dt*12);

 player.y+=player.vy*dt;
 player.vy+=1500*dt;

 if(player.y>=0){

  player.y=0;
  player.vy=0;
  player.jump=false;
 }

 if(invuln>0)invuln-=dt;
 if(hitFlash>0)hitFlash-=dt;
 if(slideTimer>0)slideTimer-=dt;
 if(boostTimer>0)boostTimer-=dt;
 if(shieldTimer>0)shieldTimer-=dt;

 speed=Math.min(9.5,5+runTime*.11);

 spawnT-=dt;

 if(spawnT<=0){

  spawn();

  spawnT=Math.max(.42,.78-runTime*.006);
 }

 const effectiveSpeed=
  speed+(boostTimer>0?3.2:0);

 for(const o of objects)
  o.z+=dt*(.35+effectiveSpeed*.055);

 for(let i=objects.length-1;i>=0;i--){

  const o=objects[i];

  if(
   (o.type==='coin'||
    o.type==='magnet'||
    o.type==='boost'||
    o.type==='shield')
   &&
   o.z>.74&&o.z<.98
  ){

   const op=roadPoint(o.z,o.lane);
   const pp=roadPoint(.82,player.lane);

   let range=o.type==='magnet'?70:28;

   if(Math.abs(op.x-pp.x)<range){

    if(o.type==='coin'){
     coinCount++;
     score+=10;
    }

    if(o.type==='magnet')
     score+=20;

    if(o.type==='boost'){
     boostTimer=4;
     score+=25;
    }

    if(o.type==='shield'){
     shieldTimer=6;
     score+=25;
    }

    objects.splice(i,1);
    continue;
   }
  }

  if(o.type==='rock'||o.type==='low'){

   if(invuln<=0){

    const op=roadPoint(o.z,o.lane);
    const pp=roadPoint(.82,player.lane);

    const xOverlap=
     Math.abs(pp.x-op.x)<35;

    const zOverlap=
     o.z>.79&&o.z<.92;

    const clearHeight=
     (-player.y)>28*op.scale;

    const lowAvoided=
     slideTimer>0&&o.type==='low';

    if(
     xOverlap&&
     zOverlap&&
     !clearHeight&&
     !lowAvoided
    ){

     if(shieldTimer>0){

      shieldTimer=0;
      score+=15;
      objects.splice(i,1);
      continue;
     }

     lives--;
     invuln=1;
     hitFlash=.18;

     objects.splice(i,1);

     if(lives<=0){
      endGame();
      return;
     }
    }
   }
  }

  if(o.z>1.15)
   objects.splice(i,1);
 }

 score+=dt*2;

 const hearts=
  '❤️'.repeat(lives)+
  '🖤'.repeat(3-lives);

 let powers='';

 if(slideTimer>0)powers+=' 🧎';
 if(boostTimer>0)powers+=' ⚡';
 if(shieldTimer>0)powers+=' 🛡️';

 document.getElementById('score').textContent=
  '得分：'+Math.floor(score)+
  '　🪙 '+coinCount+
  '　'+hearts+
  powers;
}

function draw(){

 ctx.clearRect(0,0,W,H);

 road();

 for(const o of objects)
  drawObj(o);

 drawPlayer();

 if(hitFlash>0){

  ctx.fillStyle='rgba(255,60,40,.22)';
  ctx.fillRect(0,0,W,H);
 }
}

function loop(t){

 const dt=Math.min(
  .033,
  (t-last)/1000||.016
 );

 last=t;

 if(running&&!over)
  update(dt);

 draw
